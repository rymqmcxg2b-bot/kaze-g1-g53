name: Research question
description: Point out a mistake, teach a concept, or propose a falsifiable experiment.
title: "[Research] "
labels: ["research-question"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping me investigate this. Do not include credentials, account identifiers, private endpoints, or real account-level trading data.
  - type: textarea
    id: claim
    attributes:
      label: Which claim or assumption?
      description: Which claim, assumption, or design choice should be reconsidered?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Why does it matter?
      description: How could it affect the strategy, execution, or evidence-based conclusion?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or minimal reproducible experiment
      description: A paper, counterexample, test, or falsifiable experiment is welcome.
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options:
        - Demonstrated by evidence
        - Strong but incomplete inference
        - Hypothesis to test
    validations:
      required: true
