name: Research question / 研究問題
description: Point out a mistake, teach a concept, or propose a falsifiable experiment.
title: "[Research] "
labels: ["research-question"]
body:
  - type: markdown
    attributes:
      value: |
        謝謝你願意一起研究。請勿貼上任何 credential、帳戶或真實逐筆交易資料。
  - type: textarea
    id: claim
    attributes:
      label: Which claim or assumption?
      description: 哪個敘述、假設或設計需要修正？
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Why does it matter?
      description: 它會如何影響策略、執行或證據結論？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or minimal experiment
      description: 歡迎附 paper、反例、測試或可被推翻的實驗。
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence
      options:
        - Proven / 已證明
        - Strong inference / 強推論
        - Hypothesis to test / 待測假說
    validations:
      required: true
