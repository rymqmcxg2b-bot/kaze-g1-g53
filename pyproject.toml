[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kaze-g1-g53-archive"
version = "0.1.0"
description = "A sanitized, no-network educational archive of project labels G1-G53"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "kaZe project author and contributors"}]
classifiers = [
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
where = ["src"]
