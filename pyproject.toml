[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaze-g1-g53-archive"
version = "0.1.0"
description = "A sanitized, no-network educational archive of 53 trading-system iterations"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "kaZe project author and contributors"}]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[tool.setuptools.packages.find]
where = ["src"]
